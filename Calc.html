<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Calculator</title>
</head>
    <body>
        <div class="container">
            <div class="output" id="output">
                
            </div>

            <div class="flex-container" id="calculator">
                <div class="numbers" id="numbers">
                    <div class="numClass" id="seven">
                        <p>7</p>
                    </div>

                    <div class="numClass" id="eight">
                        <p>8</p>
                    </div>

                    <div class="numClass" id="nine">
                        <p>9</p>
                    </div>

                    <div class="numClass" id="four">
                        <p>4</p>
                    </div>

                    <div class="numClass" id="five">
                        <p>5</p>
                    </div>

                    <div class="numClass" id="six">
                        <p>6</p>
                    </div>

                    <div class="numClass" id="one">
                        <p>1</p>
                    </div>

                    <div class="numClass" id="two">
                        <p>2</p>
                    </div>

                    <div class="numClass" id="three">
                        <p>3</p>
                    </div>

                    <div class="numClass" id="point">
                        <p>.</p>
                    </div>

                    <div class="numClass" id="zero">
                        <p>0</p>
                    </div>

                    <div class="numClass" id="del">
                        <p>del</p>
                    </div>
                </div>

                <div class="operators" id="operators">
                    <div class="operatorClass" id="divide">
                        <p>÷</p>
                    </div>

                    <div class="operatorClass" id="multiply">
                        <p>x</p>
                    </div>
                    
                    <div class="operatorClass" id="minus">
                        <p>-</p>
                    </div>

                    <div class="operatorClass" id="plus">
                        <p>+</p>
                    </div>

                    <div class="operatorClass" id="equals">
                        <p>=</p>
                    </div>
                </div>
                
            </div>
        </div>
    </body>
</html>
